    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: my_service
          POSTGRES_PASSWORD: my_service
          POSTGRES_DB: my_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U my_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      MY_SERVICE_TEST_DATABASE_URL: postgresql+asyncpg://my_service:my_service@localhost:5432/my_service_test
      MY_SERVICE_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
